[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vbt-baseline"
version = "0.1.0"
description = "Auditable NumPy forward baseline for the VEP virtual brain twin"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.9", "pandas>=1.5", "matplotlib>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]
